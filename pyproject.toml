[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aura"
version = "0.1.0"
requires-python = ">=3.11"
description = "Adaptive Unified Reasoning Agent - Runtime Core v0.1"
authors = [{name = "AIR Lab"}]

dependencies = [
    "pydantic>=2.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aura"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
